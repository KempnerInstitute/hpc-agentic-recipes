<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 600" width="1800" height="600" role="img" aria-label="How a recipe becomes an endpoint you can connect to">
  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1 L 11 6 L 0 11 z" fill="#14154C"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1800" height="600" fill="#F4F5FC"/>

  <rect x="60" y="40" width="1180" height="510" rx="24" fill="#FFFFFF" stroke="#6A6CB8" stroke-width="3" stroke-dasharray="12 9"/>
  <text x="92" y="94" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="bold" fill="#14154C">Kempner AI Cluster</text>

  <rect x="120" y="130" width="340" height="100" rx="14" fill="#C6C8F4" stroke="#14154C" stroke-width="3"/>
  <text x="290" y="172" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="bold" fill="#14154C">sbatch serve.sbatch</text>
  <text x="290" y="208" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#3D3E82">Slurm allocates the node</text>

  <rect x="120" y="262" width="340" height="100" rx="14" fill="#C6C8F4" stroke="#14154C" stroke-width="3"/>
  <text x="290" y="304" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="bold" fill="#14154C">serve_ssh.sh node</text>
  <text x="290" y="340" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#3D3E82">a node you already hold</text>

  <rect x="120" y="394" width="340" height="100" rx="14" fill="#A9ABE4" stroke="#14154C" stroke-width="3"/>
  <text x="290" y="436" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="bold" fill="#14154C">Shared weights</text>
  <text x="290" y="472" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#3D3E82">MODELS_DIR, read only</text>

  <rect x="580" y="215" width="340" height="194" rx="16" fill="#6A6CB8" stroke="#14154C" stroke-width="3"/>
  <text x="750" y="278" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="bold" fill="#FFFFFF">Compute node</text>
  <text x="750" y="320" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="26" fill="#F4F5FC">a whole node of GPUs,</text>
  <text x="750" y="354" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="26" fill="#F4F5FC">or a single GPU</text>
  <text x="750" y="388" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#C6C8F4">vLLM or SGLang</text>

  <rect x="1000" y="252" width="200" height="120" rx="14" fill="#A51C30" stroke="#14154C" stroke-width="3"/>
  <text x="1100" y="302" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="bold" fill="#FFFFFF">Endpoint</text>
  <text x="1100" y="340" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#FFFFFF">node:8000/v1</text>

  <rect x="1380" y="252" width="360" height="120" rx="14" fill="#FFFFFF" stroke="#14154C" stroke-width="3"/>
  <text x="1560" y="302" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="bold" fill="#14154C">Claude Code</text>
  <text x="1560" y="340" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#3D3E82">or any OpenAI client</text>

  <path d="M 460 180 L 570 262" fill="none" stroke="#14154C" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M 460 312 L 570 312" fill="none" stroke="#14154C" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M 460 444 L 570 362" fill="none" stroke="#14154C" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M 920 312 L 990 312" fill="none" stroke="#14154C" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M 1200 312 L 1370 312" fill="none" stroke="#14154C" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="1305" y="290" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#14154C">Bearer key</text>
</svg>
